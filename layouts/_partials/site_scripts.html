<script>
(function () {
  var t = document.querySelector('.nav-toggle'), l = document.getElementById('nav-links');
  if (t && l) t.addEventListener('click', function () {
    var open = l.classList.toggle('is-open'); t.setAttribute('aria-expanded', open);
  });
  if (l) l.addEventListener('click', function (e) { if (e.target.tagName === 'A') { l.classList.remove('is-open'); t && t.setAttribute('aria-expanded', 'false'); } });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.more-btn'); if (!b) return;
    var rest = b.parentNode.querySelector('.authors-rest'); if (rest) rest.hidden = false;
    b.remove();
  });
})();
</script>
