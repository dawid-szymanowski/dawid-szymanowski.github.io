{{- /* Pagefind search modal. Loads the Pagefind bundle only on first open; subpath-safe via relURL (no leading slash). */ -}}
<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-label" hidden>
  <div class="search-backdrop" data-search-close></div>
  <div class="search-panel">
    <label id="search-label" for="search-input" class="sr-only">{{ i18n "search" }}</label>
    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search-input" type="search" autocomplete="off" placeholder="{{ i18n "search_placeholder" }}">
      <button type="button" class="search-esc" data-search-close aria-label="Close">Esc</button>
    </div>
    <ul class="search-results" id="search-results" role="listbox"></ul>
    <p class="search-fallback" id="search-fallback" hidden>
      <a id="search-fallback-link" href="https://www.google.com/search?q=site:{{ site.BaseURL | replaceRE "^https?://" "" }}">{{ i18n "search_fallback" }}</a>
    </p>
  </div>
</div>
<script>
(function () {
  var modal = document.getElementById('search-modal');
  var input = document.getElementById('search-input');
  var list = document.getElementById('search-results');
  var fb = document.getElementById('search-fallback');
  var fbLink = document.getElementById('search-fallback-link');
  var site = {{ site.BaseURL | replaceRE "^https?://" "" | strings.TrimSuffix "/" }};
  var pf = null, loading = null, sel = -1, lastFocus = null, timer = null;
  function load() {
    if (pf || loading) return loading;
    loading = import('{{ "pagefind/pagefind.js" | relURL }}').then(function (m) { pf = m; return m; })
      .catch(function () { pf = null; fb.hidden = false; });
    return loading;
  }
  function open() {
    lastFocus = document.activeElement;
    modal.hidden = false; document.documentElement.classList.add('search-open');
    input.focus(); input.select(); load();
  }
  function close() {
    modal.hidden = true; document.documentElement.classList.remove('search-open');
    if (lastFocus) lastFocus.focus();
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function highlight(i) {
    var items = list.querySelectorAll('a'); sel = i;
    items.forEach(function (a, k) { a.classList.toggle('is-selected', k === i); a.setAttribute('aria-selected', k === i); });
    if (items[i]) items[i].scrollIntoView({ block: 'nearest' });
  }
  function run(q) {
    fbLink.href = 'https://www.google.com/search?q=' + encodeURIComponent('site:' + site + ' ' + q);
    if (!q.trim()) { list.innerHTML = ''; return; }
    Promise.resolve(load()).then(function () {
      if (!pf) { fb.hidden = false; return; }
      pf.debouncedSearch(q, {}, 150).then(function (r) {
        if (!r) return;
        return Promise.all(r.results.slice(0, 12).map(function (x) { return x.data(); })).then(function (rows) {
          if (!rows.length) { list.innerHTML = '<li class="search-empty">{{ i18n "search_no_results" }}</li>'; fb.hidden = false; return; }
          fb.hidden = true;
          list.innerHTML = rows.map(function (d) {
            return '<li><a role="option" href="' + esc(d.url) + '"><span class="sr-title">' + esc(d.meta.title || d.url) + '</span><span class="sr-excerpt">' + d.excerpt + '</span></a></li>';
          }).join('');
          highlight(0);
        });
      });
    });
  }
  document.querySelectorAll('[data-search-open]').forEach(function (b) { b.addEventListener('click', open); });
  modal.querySelectorAll('[data-search-close]').forEach(function (b) { b.addEventListener('click', close); });
  input.addEventListener('input', function () { clearTimeout(timer); var q = input.value; timer = setTimeout(function () { run(q); }, 80); });
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); modal.hidden ? open() : close(); return; }
    if (modal.hidden) return;
    var items = list.querySelectorAll('a');
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); highlight(Math.min(sel + 1, items.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlight(Math.max(sel - 1, 0)); }
    else if (e.key === 'Enter' && items[sel] && document.activeElement === input) { e.preventDefault(); location.href = items[sel].href; }
  });
})();
</script>
