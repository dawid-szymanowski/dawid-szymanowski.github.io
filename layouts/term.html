{{ define "main" }}
<div class="container narrow">
  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="{{ "" | relURL }}">{{ i18n "home" }}</a> / <span>{{ .Title }}</span></nav>
  <h1>{{ .Title }}</h1>
  <div class="prose">{{ .Content }}</div>
  <ul class="cite-list">
    {{- range .Pages }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
  </ul>
</div>
{{ end }}
