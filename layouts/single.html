{{ define "main" }}
<article class="container narrow">
  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="{{ "" | relURL }}">{{ i18n "home" }}</a>{{ with .Parent }}{{ if not .IsHome }} / <a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}{{ end }} / <span>{{ .Title }}</span></nav>
  <h1>{{ .Title }}</h1>
  {{- with .Params.summary }}<p class="lede">{{ . }}</p>{{ end }}
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
