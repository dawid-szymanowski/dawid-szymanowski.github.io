{{ define "main" }}
{{- $owner := site.Params.owner -}}
<article class="container narrow bio">
  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="{{ "" | relURL }}">{{ i18n "home" }}</a> / <span>{{ .Title }}</span></nav>
  <div class="bio-head">
    <img class="bio-photo" src="{{ $owner.photo | relURL }}" width="140" height="140" alt="Portrait of {{ $owner.name }}, {{ $owner.institution }}">
    <div>
      <h1>{{ .Title }}</h1>
      <p class="hero-role">{{ $owner.title }}, {{ $owner.department }}, {{ $owner.institution }}</p>
      <p class="btn-row">
        <a class="btn" href="{{ $owner.scholar }}">{{ i18n "google_scholar" }}</a>
        <a class="btn secondary" href="{{ $owner.orcid }}">{{ i18n "orcid" }}</a>
      </p>
    </div>
  </div>
  <div class="prose">{{ .Content }}</div>
  <p class="more"><a class="text-link" href="{{ "publication/" | relURL }}">{{ i18n "all_writings" }} →</a></p>
</article>
{{ end }}
