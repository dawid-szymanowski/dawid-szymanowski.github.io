{{ define "main" }}
{{- $owner := site.Params.owner -}}
<article class="container narrow">
  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="{{ "" | relURL }}">{{ i18n "home" }}</a> / <span>{{ .Title }}</span></nav>
  <h1>{{ .Title }}</h1>
  <dl class="cv-list wide contact-list">
    <dt>{{ i18n "email" }}</dt><dd><a href="mailto:{{ $owner.email }}">{{ $owner.email }}</a></dd>
    <dt>{{ i18n "postal_address" }}</dt><dd>{{ delimit $owner.address "<br>" | safeHTML }}</dd>
    {{ with $owner.bluesky }}<dt>Bluesky</dt><dd><a href="https://bsky.app/profile/{{ . }}">@{{ . }}</a></dd>{{ end }}
  </dl>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
